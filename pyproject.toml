[project]
name = "astrbot-plugin-quote-cache"
version = "1.3.0"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.11.18", "Pillow>=11.2.1", "mcp>=1.8,<2"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.11", "docstring-parser>=0.16"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
